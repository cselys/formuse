# Sector Radar — application settings.
# All thresholds are configurable; the sidebar exposes the most important ones.

data:
  provider: finnhub            # primary market data provider (used by the collector; Phase 2: dashboard)
  intraday_interval: 5m        # '5m' or '1m' — for display-only, not used by collector
  refresh_seconds: 300         # default auto-refresh interval (Phase 1 change from 60)
  cache_ttl_seconds: 55        # reuse last download within this window
  retry_count: 3
  retry_backoff_seconds: 2
  stale_warn_minutes: 20       # flag quotes older than this while market is OPEN
                               # (yfinance free data is delayed ~15 min, not tick data)
  finnhub:
    api_key_env: FINNHUB_API_KEY           # environment variable name for the API key
    base_url: https://finnhub.io/api/v1    # Finnhub API base URL
    timeout_seconds: 15                    # per-request timeout
    retry_count: 3                         # quote request retries
    retry_backoff_base_seconds: 2.0        # backoff multiplier for transient failures
    rate_limit_per_minute: 60              # observed X-Ratelimit-Limit=60 (2026-10-04)
    rate_safety_factor: 0.80               # stay under 80% of the documented cap
    stale_quote_seconds: 120               # quote age (seconds) while market OPEN => flag as stale (deprecated)
    freshness:
      fresh_max_seconds: 60               # quote age < 60s = FRESH (participates in current metrics)
      stale_threshold_seconds: 300         # quote age >= 300s = STALE (excluded from current & history)
      include_aging_in_current: false      # AGING (60-300s) excluded from current by default
  collection:
    cycle_interval_seconds: 300          # target time between full collection cycles
    batch_size: 45                       # symbols per batch (default; computed when 0)
    batch_interval_seconds: 0            # pause between batches (0 = derived)
    inter_request_delay_seconds: 0       # pause between individual requests (0 = derived)
    include_etfs: true                   # whether to also collect ETF symbols
    stock_universe_override: null        # explicit symbol list override (comma-separated)
    etf_universe_override: null          # explicit ETF list override (comma-separated)
  display_provider: finnhub             # Phase 1: dashboard reads Finnhub snapshots from SQLite
  # to finnhub snapshots from SQLite

classification:
  flat_threshold: 0.10         # |change| below this (in %) counts as FLAT
  strong_move_threshold: 1.0   # "strong" move threshold, in %

state:
  breadth_threshold: 60.0      # up/down % required for TRENDING states
  reversal_threshold: 1.0      # giveback from intraday high, in percentage points
  recovery_threshold: 1.0      # recovery from intraday low, in percentage points
  min_history_bars: 3          # minimum bars before reversal/recovery states are trusted

ui:
  top_n: 6                     # rows per ranking panel
  time_window_minutes: 60      # first-hour scanner window: 30 / 60 / 90 / 120 / full day
  min_theme_size: 5            # themes below this valid-stocks count are filtered from rankings
  show_small_sample_warning: true
  show_panels:
    top_up: true
    top_down: true
    reversals: true
    recoveries: true
    etf: true

alerts:
  breadth_change_5m: 15.0      # pp change in 5 min  -> "Breadth Breakout / Collapse"
  breadth_change_15m: 20.0     # pp change in 15 min
  strong_reversal_pp: 2.0      # giveback from high this large -> "Strong Reversal"
  strong_recovery_pp: 2.0      # recovery from low this large  -> "Strong Recovery"

composite:
  enabled: false               # optional composite score (NOT the primary ranking in V1)
  weights:
    breadth: 0.40
    avg_return: 0.30
    median_return: 0.20
    volume: 0.10